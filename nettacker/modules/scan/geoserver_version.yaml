info:
  name: geoserver_version_scan
  author: Sankalp Bansal
  severity: 3
  description: Fetch Geoserver version from target
  reference:
  profiles:
    - scan
    - http
    - low_severity
    - geoserver

payloads:
  - library: http
    steps:
      - method: get
        timeout: 3
        headers:
          User-Agent: "{user_agent}"
        allow_redirects: true
        ssl: false
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/geoserver/web"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
                - "https"
              ports:
                - 80
                - 443
        response:
          condition_type: or
          conditions:
            content:
              regex: running version <strong>([0-9.]+)</strong>
              reverse: false
          log: "GeoServer version found: response_dependent['content'][0]"
